<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="card">

            <div class="top-label">UNIVERSITY SYSTEM</div>

            <div class="icon">📚</div>

            <h1>Student Management System</h1>

            <p class="description">
                Manage student records, analyze academic results
                and track student performance easily.
            </p>

            <div class="features">

                <div class="feature">
                    <span>👨‍🎓</span>
                    <p>Student Management</p>
                </div>

                <div class="feature">
                    <span>📊</span>
                    <p>Grade Analysis</p>
                </div>

                <div class="feature">
                    <span>⭐</span>
                    <p>Grace Marks</p>
                </div>

            </div>

            <button onclick="runSystem()">
                Run Student Analysis
                <span>→</span>
            </button>

            <div class="note">
                Open Console to view the analysis results
            </div>

        </div>

        <footer>
            © 2026 Student Management System
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
